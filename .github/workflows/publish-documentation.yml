name: Publish Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:      # manual run; the job below still only deploys from main

permissions:
  contents: read

jobs:
  deploy:
    # `mkdocs gh-deploy --force` overwrites the public site: only main may do it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write     # needed to push to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # same version as publish.yml
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache
          restore-keys: |
            mkdocs-material-
      # Versions come from the `docs` dependency group in pyproject.toml.
      # `pip install --group` (PEP 735) needs pip >= 25.1.
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group docs
      - run: mkdocs gh-deploy --force
