name: NRG - Auto import issues and PR to 'Organization' project
on:
  issues:
    types:
      - opened
      - reopened
      - closed
  # This workflow never checks out or executes pull request code.
  pull_request_target:
    types:
      - opened
      - reopened
      - review_requested
      - closed

permissions:
  contents: read

# map fields with customized labels
env:
  status_backlog: Backlog
  status_todo: Todo
  status_done: Done
  status_in_progress: In Progress

jobs:
  issue_open_or_reopened:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - name: Check out token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/create-github-app-token
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: ./.github/actions/create-github-app-token
        with:
          client-id: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__CLIENT_ID }}
          private-key: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          permission-metadata: read
      - name: Move issue to ${{ env.status_backlog }}
        uses: leonsteinhaeuser/project-beta-automations@939000fb1900c9fc4f7b5058a09d9f833ebc6859
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          organization: NRGConsulting
          project_id: 3
          resource_node_id: ${{ github.event.issue.node_id }}
          status_value: ${{ env.status_backlog }} # Target status
  issue_closed:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'closed'
    steps:
      - name: Check out token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/create-github-app-token
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: ./.github/actions/create-github-app-token
        with:
          client-id: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__CLIENT_ID }}
          private-key: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          permission-metadata: read
      - name: Move issue to ${{ env.status_done }}
        uses: leonsteinhaeuser/project-beta-automations@939000fb1900c9fc4f7b5058a09d9f833ebc6859
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          organization: NRGConsulting
          project_id: 3
          resource_node_id: ${{ github.event.issue.node_id }}
          status_value: ${{ env.status_done }}
  pr_opened_or_reopened_or_reviewrequested:
    name: pr_opened_or_reopened_or_reviewrequested
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'review_requested')
    steps:
      - name: Check out token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/create-github-app-token
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: ./.github/actions/create-github-app-token
        with:
          client-id: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__CLIENT_ID }}
          private-key: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          permission-metadata: read
      - name: Move PR to ${{ env.status_in_progress }}
        uses: leonsteinhaeuser/project-beta-automations@939000fb1900c9fc4f7b5058a09d9f833ebc6859
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          organization: NRGConsulting
          project_id: 3
          resource_node_id: ${{ github.event.pull_request.node_id }}
          status_value: ${{ env.status_in_progress }} # Target status
  pr_closed:
    name: pr_closed
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action == 'closed'
    steps:
      - name: Check out token action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/actions/create-github-app-token
          persist-credentials: false
      - name: Create GitHub App token
        id: app-token
        uses: ./.github/actions/create-github-app-token
        with:
          client-id: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__CLIENT_ID }}
          private-key: ${{ secrets.NRG_APP__NRAUTOMATIONBASIC__SECRET_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
          permission-organization-projects: write
          permission-metadata: read
      - name: Move PR to ${{ env.status_done }}
        uses: leonsteinhaeuser/project-beta-automations@939000fb1900c9fc4f7b5058a09d9f833ebc6859
        with:
          gh_token: ${{ steps.app-token.outputs.token }}
          organization: NRGConsulting
          project_id: 3
          resource_node_id: ${{ github.event.pull_request.node_id }}
          status_value: ${{ env.status_done }} # Target status

