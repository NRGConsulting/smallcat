site_name: smallcat-chonk
site_description: A small, modular data catalog.
site_url: https://nrgconsulting.github.io/smallcat/
strict: true
# Planning notes for implementers: kept in the repo, not published on the site.
exclude_docs: |
  plans/
  issues.md
repo_name: NRGConsulting/smallcat
repo_url: https://github.com/NRGConsulting/smallcat
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb-auto-outline
        name: "Switch to light mode"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb
        name: "Switch to dark mode"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: grey
      accent: amber
      toggle:
        icon: material/lightbulb-outline
        name: "Switch to system preference"
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.preview
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: 'assets/images/smallcat-logo-square.png'
  favicon: 'assets/images/smallcat-logo-square.png'
extra:
  generator: false
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
nav:
  - Get Started:
    - About: index.md
    - Connections: connections.md
    - Catalog and ORM: usage.md
    - Catalog:
      - Catalog reference: catalog-reference.md
      - Querying a catalog: querying-catalog.md
      - Writing data: writing-catalog.md
    - ORM:
      - Models: models.md
      - Querying models: querying-models.md
      - Writing data: writing-models.md
    # - Changelog: changelog.md
  - Examples:
    - Connections:
      - CSV: examples/connections/csv.md
      - Google Cloud Storage: examples/connections/gcs.md
      - Amazon S3: examples/connections/s3.md
    - Catalog:
      - Connections: examples/catalog/connections.md
      - Airflow: examples/catalog/airflow.md
      - Parquet on GCS: examples/catalog/gcs.md
    - ORM:
      - Connections: examples/orm/connections.md
      - Models: examples/orm/models.md
      - Querying: examples/orm/querying.md
  - API reference:
    - Datasets: api/datasets.md
    - Connections: api/connections.md
    - Catalog: api/catalog.md
    - Models: api/models.md
  # - Modules:
    # - Apps:
  #     - About Us:
  #       - Apps: apps/about_us/apps.md
  #       - Factories: apps/about_us/factories.md
  #       - Models: apps/about_us/models.md
  #   - Utils:
  #     - Pages: utils/pages.md
copyright: Copyright &copy; 2023-2027 NRG.
markdown_extensions:
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true
      title: Page contents
watch:
  - src/smallcat
  - README.md
  # - CHANGELOG.md
plugins:
  - include-markdown:
      rewrite_relative_urls: true   # rewrites image/link paths in the included file
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            extensions:
              - griffe_pydantic:
                  schema: false
            annotations_path: source
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true
            docstring_style: google
            filters: ["!^_"]
            line_length: 88
            members_order: source
            separate_signature: true
            signature_crossrefs: true
            show_bases: true
            show_signature_annotations: true
          inventories:
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
